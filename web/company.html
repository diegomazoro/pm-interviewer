<script src="config.js"></script>
<script src="catalog.js"></script>
<script src="auth.js"></script>
<script>
  if (!requireLogin()) {
    // requireLogin() already redirected to login.html
  } else {
  wireAccountNav();
  const slug = new URLSearchParams(window.location.search).get("company");
  const co = companiesFromConfig().find((c) => c.slug === slug);
  if (!co) {
    document.getElementById("company-not-found").style.display = "block";
  } else {
    document.title = `${co.name} cases — Loudcase`;
    document.getElementById("company-icon").textContent = co.name.charAt(0);
    document.getElementById("company-name").textContent = co.name;
    document.getElementById("company-tagline").textContent = co.tagline;
    document.getElementById("company-intro").textContent =
      `${co.cases.length} live ${co.cases.length === 1 ? "case" : "cases"}, each testing a different PM skill. Start whichever you want to practice.`;
    const list = document.getElementById("company-case-list");
    co.cases.forEach((c) => {
      const skill = SKILLS.find((s) => s.name === c.skill);
      const li = document.createElement("li");
      li.className = "company-case";
      li.innerHTML = `
        <div class="company-case-text">
          <span class="badge">${escapeHtml(c.skill)}</span>
          <h3>${escapeHtml(c.subtitle)}</h3>
          ${skill ? `<p>${escapeHtml(skill.blurb)}</p>` : ""}
        </div>
        <a class="btn" href="session.html?case=${encodeURIComponent(c.id)}">Start</a>
      `;
      list.appendChild(li);
    });
    document.getElementById("company-content").style.display = "block";
  }
  }
</script>

<div class="modal-overlay" id="product-feedback-modal" style="display:none;">
  <div class="modal-card">
    <button type="button" class="modal-close" id="product-feedback-close-btn" aria-label="Close">&times;</button>
    <h2>Send us feedback</h2>
    <form class="feedback-form" id="product-feedback-form">
      <textarea id="product-feedback-text" placeholder="Type your feedback here..." required></textarea>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:16px;">
        <span class="hint" id="product-feedback-status">We read all the submissions carefully :)</span>
        <button type="submit" class="btn" id="product-feedback-submit"><span class="btn-shine">Submit</span></button>
      </div>
    </form>
  </div>
</div>
<script>
(function () {
  const fab = document.getElementById("feedback-fab");
  const modal = document.getElementById("product-feedback-modal");
  const form = document.getElementById("product-feedback-form");
  const textarea = document.getElementById("product-feedback-text");
  const submitBtn = document.getElementById("product-feedback-submit");
  const status = document.getElementById("product-feedback-status");
  const FEEDBACK_DEFAULT_STATUS = "We read all the submissions carefully :)";

  function openFeedbackModal() {
    status.textContent = FEEDBACK_DEFAULT_STATUS;
    textarea.value = "";
    modal.style.display = "flex";
    textarea.focus();
  }
  function closeFeedbackModal() {
    modal.style.display = "none";
  }

  fab.addEventListener("click", openFeedbackModal);
  document.getElementById("product-feedback-close-btn").addEventListener("click", closeFeedbackModal);
  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeFeedbackModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.style.display === "flex") closeFeedbackModal();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = textarea.value.trim();
    if (!message) return;
    submitBtn.disabled = true;
    status.textContent = "Sending...";
    try {
      const res = await fetch(`${CONFIG.backendUrl}/feedback`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeader() },
        body: JSON.stringify({ message, page: window.location.pathname.split("/").pop() }),
      });
      if (res.status === 401) {
        status.textContent = "Please log in again to send feedback.";
        submitBtn.disabled = false;
        return;
      }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        status.textContent = data.detail || "Something went wrong sending your feedback.";
        submitBtn.disabled = false;
        return;
      }
      status.textContent = "Thanks, we got it!";
      submitBtn.disabled = false;
      setTimeout(closeFeedbackModal, 1200);
    } catch (err) {
      status.textContent = "Something went wrong. Please try again.";
      submitBtn.disabled = false;
    }
  });
})();
</script>
<script>
  // Cursor-tracking spotlight for .btn (not .btn.secondary), matching
  // pomelo.la's actual button hover effect (see styles.css for the full
  // explanation -- their "duplicate text" DOM layer is same-color,
  // same-position, and functionally invisible; this spotlight is the
  // effect that's actually visible). Appends a .btn-spotlight overlay and
  // keeps its --x/--y CSS vars updated on mousemove; safe to call more
  // than once since already-enhanced elements are skipped.
  function enhanceButtonSpotlight(btn) {
    if (btn.dataset.spotlightEnhanced) return;
    btn.dataset.spotlightEnhanced = "true";
    const spot = document.createElement("span");
    spot.className = "btn-spotlight";
    spot.setAttribute("aria-hidden", "true");
    btn.appendChild(spot);
    btn.addEventListener("mousemove", (e) => {
      const rect = btn.getBoundingClientRect();
      spot.style.setProperty("--x", `${e.clientX - rect.left}px`);
      spot.style.setProperty("--y", `${e.clientY - rect.top}px`);
    });
  }
  function enhanceAllButtonSpotlights(root) {
    (root || document).querySelectorAll(".btn:not(.secondary)").forEach(enhanceButtonSpotlight);
  }
  enhanceAllButtonSpotlights();
</script>
</body>
