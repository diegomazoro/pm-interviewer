<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a live case — Loudcase</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <div style="display:flex; align-items:center; gap:24px;">
    <a href="index.html" class="brand" aria-label="Loudcase">
        <svg width="129" height="27" viewBox="0 0 170 36" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="18" x2="170" y2="18" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#d9720f"/>
              <stop offset="55%" stop-color="#ef9f27"/>
              <stop offset="100%" stop-color="#ffcf6b"/>
            </linearGradient>
            <mask id="logoGradMask" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
              <rect width="36" height="36" rx="10" fill="#ffffff"/>
              <rect x="9" y="12" width="4" height="12" rx="2" fill="#000000"/>
              <rect x="16" y="6" width="4" height="24" rx="2" fill="#000000"/>
              <rect x="23" y="10" width="4" height="16" rx="2" fill="#000000"/>
            </mask>
          </defs>
          <rect width="36" height="36" rx="10" fill="url(#logoGrad)" mask="url(#logoGradMask)"/>
          <text x="47" y="18" dominant-baseline="central" text-anchor="start" font-family="Bricolage Grotesque, sans-serif" font-weight="400" font-size="26" textLength="120" lengthAdjust="spacingAndGlyphs" fill="url(#logoGrad)">Loudcase</text>
        </svg>
      </a>
    <span style="color: var(--accent); font-size:14px; font-weight:600;">Live cases</span>
    <a href="history.html" style="color: var(--text-muted); text-decoration:none; font-size:14px;">My interviews</a>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <button type="button" id="feedback-fab" style="background:none; border:1px solid var(--accent); color: var(--accent); font-size:14px; font-family:inherit; cursor:pointer; padding:6px 14px; border-radius:999px;">Feedback?</button>
    <span id="nav-email" style="color: var(--text-muted); font-size: 14px;"></span>
    <a href="#" id="logout-link" class="btn secondary" style="padding:8px 16px;font-size:14px;">Log out</a>
  </div>
</nav>

<div class="wrap">
  <h1>Choose a live case</h1>
  <p style="color: var(--text-muted)">Talk with an interviewer that presents you a live case modeled on real PM challenges at top tech companies.</p>

  <div class="filter-bar" id="filter-bar">
    <button type="button" class="filter-chip active" data-filter="all">All</button>
    <button type="button" class="filter-chip" data-filter="product sense">Product sense</button>
    <button type="button" class="filter-chip" data-filter="business sense">Business sense</button>
    <button type="button" class="filter-chip" data-filter="problem solving">Problem solving</button>
    <button type="button" class="filter-chip" data-filter="analytical">Analytical</button>
  </div>

  <div class="case-grid" id="case-grid"></div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  if (!requireLogin()) {
    // requireLogin() already redirected to login.html
  } else {
  wireAccountNav();
  const grid = document.getElementById("case-grid");
  const filterBar = document.getElementById("filter-bar");
  let activeFilter = "all";

  function renderCases() {
    grid.innerHTML = "";
    CONFIG.cases
      .filter((c) => activeFilter === "all" || c.type.toLowerCase() === activeFilter)
      .forEach((c) => {
        const card = document.createElement("div");
        card.className = "case-card";
        card.innerHTML = `
          <div class="case-card-head">
            <span class="badge">${c.type}</span>
          </div>
          <h3>${c.title}</h3>
          <p>${c.subtitle}</p>
          <a class="btn" href="session.html?case=${encodeURIComponent(c.id)}">Start case</a>
        `;
        grid.appendChild(card);
      });
  }

  filterBar.querySelectorAll(".filter-chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeFilter = btn.dataset.filter;
      filterBar.querySelectorAll(".filter-chip").forEach((b) => b.classList.toggle("active", b === btn));
      renderCases();
    });
  });

  renderCases();
  }
</script>

<div class="modal-overlay" id="product-feedback-modal" style="display:none;">
  <div class="modal-card">
    <button type="button" class="modal-close" id="product-feedback-close-btn" aria-label="Close">&times;</button>
    <form class="feedback-form" id="product-feedback-form">
      <textarea id="product-feedback-text" placeholder="Type your feedback here..." required></textarea>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:16px;">
        <span class="hint" id="product-feedback-status">We read all the submissions carefully and we will try to get back to you asap :)</span>
        <button type="submit" class="btn" id="product-feedback-submit"><span class="btn-shine">Submit</span></button>
      </div>
    </form>
  </div>
</div>
<script>
(function () {
  const fab = document.getElementById("feedback-fab");
  const modal = document.getElementById("product-feedback-modal");
  const form = document.getElementById("product-feedback-form");
  const textarea = document.getElementById("product-feedback-text");
  const submitBtn = document.getElementById("product-feedback-submit");
  const status = document.getElementById("product-feedback-status");
  const FEEDBACK_DEFAULT_STATUS = "We read all the submissions carefully and we will try to get back to you asap :)";

  function openFeedbackModal() {
    status.textContent = FEEDBACK_DEFAULT_STATUS;
    textarea.value = "";
    modal.style.display = "flex";
    textarea.focus();
  }
  function closeFeedbackModal() {
    modal.style.display = "none";
  }

  fab.addEventListener("click", openFeedbackModal);
  document.getElementById("product-feedback-close-btn").addEventListener("click", closeFeedbackModal);
  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeFeedbackModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.style.display === "flex") closeFeedbackModal();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = textarea.value.trim();
    if (!message) return;
    submitBtn.disabled = true;
    status.textContent = "Sending...";
    try {
      const res = await fetch(`${CONFIG.backendUrl}/feedback`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeader() },
        body: JSON.stringify({ message, page: window.location.pathname.split("/").pop() }),
      });
      if (res.status === 401) {
        status.textContent = "Please log in again to send feedback.";
        submitBtn.disabled = false;
        return;
      }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        status.textContent = data.detail || "Something went wrong sending your feedback.";
        submitBtn.disabled = false;
        return;
      }
      status.textContent = "Thanks -- we got it!";
      submitBtn.disabled = false;
      setTimeout(closeFeedbackModal, 1200);
    } catch (err) {
      status.textContent = "Something went wrong. Please try again.";
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
