<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a live case — Loudcase</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <a href="index.html" class="brand" aria-label="Loudcase">
      <svg width="161" height="34" viewBox="0 0 170 36" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="18" x2="170" y2="18" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#d9720f"/>
            <stop offset="55%" stop-color="#ef9f27"/>
            <stop offset="100%" stop-color="#ffcf6b"/>
          </linearGradient>
          <mask id="logoGradMask" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
            <rect width="36" height="36" rx="10" fill="#ffffff"/>
            <rect x="9" y="12" width="4" height="12" rx="2" fill="#000000"/>
            <rect x="16" y="6" width="4" height="24" rx="2" fill="#000000"/>
            <rect x="23" y="10" width="4" height="16" rx="2" fill="#000000"/>
          </mask>
        </defs>
        <rect width="36" height="36" rx="10" fill="url(#logoGrad)" mask="url(#logoGradMask)"/>
        <text x="47" y="18" dominant-baseline="central" text-anchor="start" font-family="Bricolage Grotesque, sans-serif" font-weight="700" font-size="26" textLength="120" lengthAdjust="spacingAndGlyphs" fill="url(#logoGrad)">Loudcase</text>
      </svg>
    </a>
  <div style="display:flex; align-items:center; gap:16px;">
    <a href="history.html" style="color: var(--text-muted); text-decoration:none; font-size:14px;">History</a>
    <a href="index.html#pricing" style="color: var(--text-muted); text-decoration:none; font-size:14px;">Pricing</a>
    <span id="nav-email" style="color: var(--text-muted); font-size: 14px;"></span>
    <a href="#" id="logout-link" class="btn secondary" style="padding:8px 16px;font-size:14px;">Log out</a>
  </div>
</nav>

<div class="wrap">
  <h1>Choose a live case</h1>
  <p style="color: var(--text-muted)">Talk with an interviewer that presents you a live case modeled on real PM challenges at top tech companies.</p>

  <div class="filter-bar" id="filter-bar">
    <button type="button" class="filter-chip active" data-filter="all">All</button>
    <button type="button" class="filter-chip" data-filter="product sense">Product sense</button>
    <button type="button" class="filter-chip" data-filter="business sense">Business sense</button>
    <button type="button" class="filter-chip" data-filter="problem solving">Problem solving</button>
    <button type="button" class="filter-chip" data-filter="analytical">Analytical</button>
  </div>

  <div class="case-grid" id="case-grid"></div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  if (!requireLogin()) {
    // requireLogin() already redirected to login.html
  } else {
  wireAccountNav();
  const grid = document.getElementById("case-grid");
  const filterBar = document.getElementById("filter-bar");
  let activeFilter = "all";

  function renderCases() {
    grid.innerHTML = "";
    CONFIG.cases
      .filter((c) => activeFilter === "all" || c.type.toLowerCase() === activeFilter)
      .forEach((c) => {
        const card = document.createElement("div");
        card.className = "case-card";
        card.innerHTML = `
          <div class="case-card-head">
            <span class="badge">${c.type}</span>
          </div>
          <h3>${c.title}</h3>
          <p>${c.subtitle}</p>
          <a class="btn" href="session.html?case=${encodeURIComponent(c.id)}">Start case</a>
        `;
        grid.appendChild(card);
      });
  }

  filterBar.querySelectorAll(".filter-chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      activeFilter = btn.dataset.filter;
      filterBar.querySelectorAll(".filter-chip").forEach((b) => b.classList.toggle("active", b === btn));
      renderCases();
    });
  });

  renderCases();
  }
</script>
</body>
</html>
