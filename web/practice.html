<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a case — Loudcase</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <a href="index.html" class="brand">
    <svg width="26" height="26" viewBox="0 0 36 36" aria-hidden="true">
      <rect width="36" height="36" rx="10" fill="#ef9f27"/>
      <rect x="10" y="12" width="4" height="12" rx="2" fill="#3d2003"/>
      <rect x="17" y="6" width="4" height="24" rx="2" fill="#3d2003"/>
      <rect x="24" y="10" width="4" height="16" rx="2" fill="#3d2003"/>
    </svg>
    Loudcase
  </a>
</nav>

<div class="wrap">
  <h1>Choose a case</h1>
  <p style="color: var(--text-muted)">Live PM case interviews modeled on real challenges at companies like these. Each one runs as a voice conversation -- the interviewer reads the case prompt out loud and waits for your questions.</p>

  <div class="case-grid" id="case-grid"></div>
</div>

<script src="config.js"></script>
<script>
  const grid = document.getElementById("case-grid");
  CONFIG.cases.forEach((c) => {
    const card = document.createElement("div");
    card.className = "case-card";
    card.innerHTML = `
      <span class="badge">${c.type}</span>
      <h3>${c.title}</h3>
      <p>${c.subtitle}</p>
      <a class="btn secondary" href="session.html?case=${encodeURIComponent(c.id)}">Start this case</a>
    `;
    grid.appendChild(card);
  });
</script>
</body>
</html>
