<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a live case — Loudcase</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <a href="index.html" class="brand">
    <svg width="26" height="26" viewBox="0 0 36 36" aria-hidden="true">
      <rect width="36" height="36" rx="10" fill="#ef9f27"/>
      <rect x="10" y="12" width="4" height="12" rx="2" fill="#3d2003"/>
      <rect x="17" y="6" width="4" height="24" rx="2" fill="#3d2003"/>
      <rect x="24" y="10" width="4" height="16" rx="2" fill="#3d2003"/>
    </svg>
    Loudcase
  </a>
  <div style="display:flex; align-items:center; gap:16px;">
    <span id="nav-email" style="color: var(--text-muted); font-size: 14px;"></span>
    <a href="#" id="logout-link" class="btn secondary" style="padding:8px 16px;font-size:14px;">Log out</a>
  </div>
</nav>

<div class="wrap">
  <h1>Choose a live case</h1>
  <p style="color: var(--text-muted)">Talk with an interviewer that presents you a live case modeled on real PM challenges at top tech companies.</p>

  <div class="case-grid" id="case-grid"></div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  if (!requireLogin()) {
    // requireLogin() already redirected to login.html
  } else {
  wireAccountNav();
  const grid = document.getElementById("case-grid");
  CONFIG.cases.forEach((c) => {
    const card = document.createElement("div");
    card.className = "case-card";
    const initial = c.title.charAt(0).toUpperCase();
    card.innerHTML = `
      <div class="case-card-head">
        <span class="case-icon" aria-hidden="true">${initial}</span>
        <span class="badge">${c.type}</span>
      </div>
      <h3>${c.title}</h3>
      <p>${c.subtitle}</p>
      <a class="btn" href="session.html?case=${encodeURIComponent(c.id)}">Start case</a>
    `;
    grid.appendChild(card);
  });
  }
</script>
</body>
</html>
