<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your history — Loudcase</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <a href="index.html" class="brand" aria-label="Loudcase">
      <svg width="129" height="27" viewBox="0 0 170 36" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="18" x2="170" y2="18" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#d9720f"/>
            <stop offset="55%" stop-color="#ef9f27"/>
            <stop offset="100%" stop-color="#ffcf6b"/>
          </linearGradient>
          <mask id="logoGradMask" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
            <rect width="36" height="36" rx="10" fill="#ffffff"/>
            <rect x="9" y="12" width="4" height="12" rx="2" fill="#000000"/>
            <rect x="16" y="6" width="4" height="24" rx="2" fill="#000000"/>
            <rect x="23" y="10" width="4" height="16" rx="2" fill="#000000"/>
          </mask>
        </defs>
        <rect width="36" height="36" rx="10" fill="url(#logoGrad)" mask="url(#logoGradMask)"/>
        <text x="47" y="18" dominant-baseline="central" text-anchor="start" font-family="Bricolage Grotesque, sans-serif" font-weight="400" font-size="26" textLength="120" lengthAdjust="spacingAndGlyphs" fill="url(#logoGrad)">Loudcase</text>
      </svg>
    </a>
  <div style="display:flex; align-items:center; gap:16px;">
    <a href="practice.html" class="btn secondary" style="padding:8px 16px;font-size:14px;">Choose a case</a>
    <span id="nav-email" style="color: var(--text-muted); font-size: 14px;"></span>
    <a href="#" id="logout-link" class="btn secondary" style="padding:8px 16px;font-size:14px;">Log out</a>
  </div>
</nav>

<div class="wrap">
  <h1>Your history</h1>
  <p style="color: var(--text-muted)">Every scored interview you've run. Your first two come with full feedback -- after that, upgrade to Premium to unlock detailed feedback on the rest.</p>

  <div id="history-list" style="margin-top:24px; display:flex; flex-direction:column; gap:16px;"></div>
  <p id="empty-msg" style="display:none; color: var(--text-muted);">No scored interviews yet -- head to a case and finish one to see it here.</p>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  if (!requireLogin()) {
    throw new Error("redirecting to login");
  }
  wireAccountNav();

  function caseTitle(caseId) {
    const c = CONFIG.cases.find((c) => c.id === caseId);
    return c ? c.title : caseId;
  }

  async function startCheckout(btn) {
    if (btn) btn.disabled = true;
    try {
      const res = await fetch(`${CONFIG.backendUrl}/billing/create-checkout-session`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeader() },
        body: JSON.stringify({
          success_url: window.location.origin + window.location.pathname.replace(/history\.html$/, "") + "premium-success.html",
          cancel_url: window.location.href,
        }),
      });
      if (res.status === 401) {
        logout();
        return;
      }
      const data = await res.json();
      if (!res.ok) {
        alert(data.detail || "Something went wrong starting checkout.");
        if (btn) btn.disabled = false;
        return;
      }
      window.location.href = data.url;
    } catch (err) {
      alert("Something went wrong. Refresh the page and try again, or email diegomazorosete@gmail.com.");
      if (btn) btn.disabled = false;
    }
  }

  (async () => {
    try {
      const res = await fetch(`${CONFIG.backendUrl}/history`, { headers: authHeader() });
      if (res.status === 401) {
        document.getElementById("history-list").textContent =
          "Your session looks invalid. Please log in again to see your history.";
        return;
      }
      const data = await res.json();
      const list = document.getElementById("history-list");
      if (!data.interviews || data.interviews.length === 0) {
        document.getElementById("empty-msg").style.display = "block";
        return;
      }
      data.interviews.forEach((item) => {
        const date = new Date(item.created_at * 1000).toLocaleDateString(undefined, {
          year: "numeric", month: "short", day: "numeric",
        });
        const entry = document.createElement("div");
        entry.className = "case-card";

        const head = document.createElement("div");
        head.className = "case-card-head";
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = caseTitle(item.case_id);
        head.appendChild(badge);
        entry.appendChild(head);

        const h3 = document.createElement("h3");
        h3.textContent = item.score_summary || "Score unavailable";
        entry.appendChild(h3);

        const dateEl = document.createElement("p");
        dateEl.style.cssText = "color: var(--text-muted); font-size:13px;";
        dateEl.textContent = date;
        entry.appendChild(dateEl);

        if (item.full_feedback) {
          const pre = document.createElement("pre");
          pre.className = "scorecard";
          pre.style.margin = "0";
          pre.textContent = item.scorecard;
          entry.appendChild(pre);
        } else {
          const lockedMsg = document.createElement("p");
          lockedMsg.className = "hint";
          lockedMsg.textContent = "Detailed feedback for this interview is a Premium feature.";
          entry.appendChild(lockedMsg);

          const upgradeBtn = document.createElement("button");
          upgradeBtn.type = "button";
          upgradeBtn.className = "btn secondary";
          upgradeBtn.style.marginTop = "8px";
          upgradeBtn.textContent = "Get Premium";
          upgradeBtn.addEventListener("click", () => startCheckout(upgradeBtn));
          entry.appendChild(upgradeBtn);
        }

        list.appendChild(entry);
      });
    } catch (err) {
      document.getElementById("history-list").textContent = `Failed to load history: ${err}`;
    }
  })();
</script>
</body>
</html>
