<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice session — Loudcase</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <a href="index.html" class="brand">
    <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#d9720f"/>
          <stop offset="55%" stop-color="#ef9f27"/>
          <stop offset="100%" stop-color="#ffcf6b"/>
        </linearGradient>
        <mask id="logoGradMask" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" rx="10" fill="#ffffff"/>
      <rect x="10" y="12" width="4" height="12" rx="2" fill="#000000"/>
      <rect x="17" y="6" width="4" height="24" rx="2" fill="#000000"/>
      <rect x="24" y="10" width="4" height="16" rx="2" fill="#000000"/>
    </mask>
  </defs>
  <rect width="36" height="36" rx="10" fill="url(#logoGrad)" mask="url(#logoGradMask)"/>
    </svg>
    <span class="brand-text">Loudcase</span>
  </a>
  <div style="display:flex; align-items:center; gap:16px;">
    <span id="nav-email" style="color: var(--text-muted); font-size: 14px;"></span>
    <a href="#" id="logout-link" class="btn secondary" style="padding:8px 16px;font-size:14px;">Log out</a>
  </div>
</nav>

<div class="wrap">
  <div id="not-configured" class="widget-box" style="display:none; flex-direction:column; gap:12px;">
    <strong>Setup incomplete</strong>
    <p style="color: var(--text-muted); text-align:center;">
      <code>web/config.js</code> still has placeholder values for the backend
      URL or ElevenLabs agent ID. Finish
      <code>agent/VOICE_SETUP.md</code> first, then fill those in.
    </p>
  </div>

  <div id="session-content" style="display:none;">
    <div class="session-header">
      <a href="practice.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12.5 4.5L6 10l6.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to cases
      </a>
      <h1 id="case-title"></h1>
      <p id="case-subtitle"></p>
    </div>

    <!-- The widget's internal conversation panel is rendered as
         position:fixed relative to the *viewport*, inside a Shadow DOM --
         setting position:static/fixed on the host tag itself doesn't reach
         that internal panel, which is why earlier attempts still showed it
         pinned near the header. The fix that actually works: wrapping it in
         an ancestor with a CSS `transform` -- a transformed ancestor becomes
         the "containing block" for any position:fixed descendant, even
         across a Shadow DOM boundary (this is normal CSS containing-block
         behavior, not something Shadow DOM blocks). That pins the widget's
         panel to THIS box instead of the viewport. -->
    <div class="widget-anchor">
      <elevenlabs-convai id="convai-widget"></elevenlabs-convai>
    </div>

    <div class="notes-box">
      <h3 class="notes-title">Take your notes</h3>
      <textarea id="notes-field" placeholder="Write relevant data shared by the interviewer"></textarea>
    </div>

    <div class="results-actions">
      <button class="btn" id="evaluate-btn">Get my scorecard</button>
    </div>
    <pre class="scorecard" id="scorecard-output" style="display:none;"></pre>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async></script>
<script>
  if (!requireLogin()) {
    throw new Error("redirecting to login");
  }
  wireAccountNav();

  const params = new URLSearchParams(window.location.search);
  const caseId = params.get("case");
  const caseInfo = CONFIG.cases.find((c) => c.id === caseId);

  const isPlaceholder = (v) => !v || v.startsWith("REPLACE_WITH");

  if (!caseInfo || isPlaceholder(CONFIG.backendUrl) || isPlaceholder(CONFIG.agentId)) {
    document.getElementById("not-configured").style.display = "flex";
  } else {
    document.getElementById("session-content").style.display = "block";
    document.getElementById("case-title").textContent = caseInfo.title;
    document.getElementById("case-subtitle").textContent = caseInfo.subtitle;

    // One shared Agent for the whole library -- which case runs is passed
    // per-conversation via dynamic-variables, which fills in the
    // {{case_id}} in the Agent's own system prompt ("CASE_ID: {{case_id}}"),
    // and server.py reads it back out of that system message.
    //
    // first_message is passed the same way, filling in the Agent's "First
    // message" field ({{first_message}}) so ElevenLabs speaks the case's
    // exact opening line itself via its own TTS -- it does NOT go through
    // our custom LLM. This matters because an empty "First message" field
    // just makes the agent wait silently for the user to speak first,
    // which would never happen (the candidate doesn't know the case yet).
    // Generate our OWN session id client-side, before the call even starts,
    // instead of trying to capture ElevenLabs' internal conversation id
    // after the fact. This is the reliable fix: we don't know the exact
    // shape of the widget's events, and even if we captured ElevenLabs'
    // own id, our backend never sees it during the call (it's not part of
    // the custom-LLM request), so it wouldn't match the filename our
    // server actually saves the transcript under. Generating the id
    // ourselves and threading it through as a dynamic variable means both
    // sides agree on it from the very first turn.
    const generatedSessionId = crypto.randomUUID().slice(0, 12);

    const widget = document.getElementById("convai-widget");
    widget.setAttribute("agent-id", CONFIG.agentId);
    widget.setAttribute(
      "dynamic-variables",
      JSON.stringify({ case_id: caseInfo.id, first_message: caseInfo.firstMessage, session_id: generatedSessionId })
    );

    document.getElementById("evaluate-btn").addEventListener("click", async () => {
      const output = document.getElementById("scorecard-output");
      output.style.display = "block";
      output.textContent = "Scoring...";
      try {
        const res = await fetch(`${CONFIG.backendUrl}/evaluate`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeader() },
          body: JSON.stringify({ case_id: caseId, session_id: generatedSessionId }),
        });
        if (res.status === 401) {
          logout();
          return;
        }
        const data = await res.json();
        if (res.status === 402) {
          output.innerHTML = `${data.detail}<br><br><a class="btn" href="index.html#pricing"><span class="btn-shine">See Premium</span></a>`;
          return;
        }
        output.textContent = res.ok ? data.scorecard : `Error: ${data.detail || res.status}`;
      } catch (err) {
        output.textContent = `Request failed: ${err}`;
      }
    });
  }
</script>
</body>
</html>
