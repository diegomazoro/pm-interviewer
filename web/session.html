<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice session — Loudcase</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <a href="index.html" class="brand" aria-label="Loudcase">
      <svg width="129" height="27" viewBox="0 0 170 36" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="18" x2="170" y2="18" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#d9720f"/>
            <stop offset="55%" stop-color="#ef9f27"/>
            <stop offset="100%" stop-color="#ffcf6b"/>
          </linearGradient>
          <mask id="logoGradMask" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
            <rect width="36" height="36" rx="10" fill="#ffffff"/>
            <rect x="9" y="12" width="4" height="12" rx="2" fill="#000000"/>
            <rect x="16" y="6" width="4" height="24" rx="2" fill="#000000"/>
            <rect x="23" y="10" width="4" height="16" rx="2" fill="#000000"/>
          </mask>
        </defs>
        <rect width="36" height="36" rx="10" fill="url(#logoGrad)" mask="url(#logoGradMask)"/>
        <text x="47" y="18" dominant-baseline="central" text-anchor="start" font-family="Bricolage Grotesque, sans-serif" font-weight="400" font-size="26" textLength="120" lengthAdjust="spacingAndGlyphs" fill="url(#logoGrad)">Loudcase</text>
      </svg>
    </a>
  <div style="display:flex; align-items:center; gap:16px;">
    <span id="nav-email" style="color: var(--text-muted); font-size: 14px;"></span>
    <a href="#" id="logout-link" class="btn secondary" style="padding:8px 16px;font-size:14px;">Log out</a>
  </div>
</nav>

<div class="wrap">
  <div id="not-configured" class="widget-box" style="display:none; flex-direction:column; gap:12px;">
    <strong>Setup incomplete</strong>
    <p style="color: var(--text-muted); text-align:center;">
      <code>web/config.js</code> still has placeholder values for the backend
      URL or ElevenLabs agent ID. Finish
      <code>agent/VOICE_SETUP.md</code> first, then fill those in.
    </p>
  </div>

  <div id="session-content" style="display:none;">
    <div class="session-header">
      <a href="practice.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12.5 4.5L6 10l6.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to cases
      </a>
      <h1 id="case-title"></h1>
      <p id="case-subtitle"></p>
    </div>

    <!-- The widget's internal conversation panel is rendered as
         position:fixed relative to the *viewport*, inside a Shadow DOM --
         setting position:static/fixed on the host tag itself doesn't reach
         that internal panel, which is why earlier attempts still showed it
         pinned near the header. The fix that actually works: wrapping it in
         an ancestor with a CSS `transform` -- a transformed ancestor becomes
         the "containing block" for any position:fixed descendant, even
         across a Shadow DOM boundary (this is normal CSS containing-block
         behavior, not something Shadow DOM blocks). That pins the widget's
         panel to THIS box instead of the viewport. -->
    <div class="widget-anchor">
      <elevenlabs-convai id="convai-widget"></elevenlabs-convai>
    </div>

    <div class="notes-box">
      <h3 class="notes-title">Take your notes</h3>
      <textarea id="notes-field" placeholder="Write relevant data shared by the interviewer"></textarea>
    </div>

    <!-- Scoring is meant to run automatically once the widget's own "End
         call" button ends the conversation (see the shadow-DOM
         MutationObserver below) -- but the widget exposes no supported,
         documented event for "call ended" (its only public DOM event,
         "elevenlabs-convai:call", fires before the call starts, and the
         widget's own startSession() call unconditionally overwrites
         onDisconnect/onStatusChange afterwards, discarding anything we set
         there). The auto-detection is a best-effort heuristic against
         undocumented internals, so this manual button stays as a fallback
         that always works regardless of widget internals. -->
    <div class="results-actions">
      <button type="button" class="btn secondary" id="evaluate-btn">Get my scorecard</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="scorecard-modal" style="display:none;">
  <div class="modal-card">
    <button type="button" class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async></script>
<script>
  if (!requireLogin()) {
    throw new Error("redirecting to login");
  }
  wireAccountNav();

  const params = new URLSearchParams(window.location.search);
  const caseId = params.get("case");
  const caseInfo = CONFIG.cases.find((c) => c.id === caseId);

  const isPlaceholder = (v) => !v || v.startsWith("REPLACE_WITH");

  if (!caseInfo || isPlaceholder(CONFIG.backendUrl) || isPlaceholder(CONFIG.agentId)) {
    document.getElementById("not-configured").style.display = "flex";
  } else {
    document.getElementById("session-content").style.display = "block";
    document.getElementById("case-title").textContent = caseInfo.title;
    document.getElementById("case-subtitle").textContent = caseInfo.subtitle;

    // One shared Agent for the whole library -- which case runs is passed
    // per-conversation via dynamic-variables, which fills in the
    // {{case_id}} in the Agent's own system prompt ("CASE_ID: {{case_id}}"),
    // and server.py reads it back out of that system message.
    //
    // first_message is passed the same way, filling in the Agent's "First
    // message" field ({{first_message}}) so ElevenLabs speaks the case's
    // exact opening line itself via its own TTS -- it does NOT go through
    // our custom LLM. This matters because an empty "First message" field
    // just makes the agent wait silently for the user to speak first,
    // which would never happen (the candidate doesn't know the case yet).
    // Generate our OWN session id client-side, before the call even starts,
    // instead of trying to capture ElevenLabs' internal conversation id
    // after the fact. This is the reliable fix: we don't know the exact
    // shape of the widget's events, and even if we captured ElevenLabs'
    // own id, our backend never sees it during the call (it's not part of
    // the custom-LLM request), so it wouldn't match the filename our
    // server actually saves the transcript under. Generating the id
    // ourselves and threading it through as a dynamic variable means both
    // sides agree on it from the very first turn.
    const generatedSessionId = crypto.randomUUID().slice(0, 12);

    const widget = document.getElementById("convai-widget");
    widget.setAttribute("agent-id", CONFIG.agentId);
    widget.setAttribute(
      "dynamic-variables",
      JSON.stringify({ case_id: caseInfo.id, first_message: caseInfo.firstMessage, session_id: generatedSessionId })
    );

    // ---- Scorecard popup ----
    const modal = document.getElementById("scorecard-modal");
    const modalBody = document.getElementById("modal-body");

    function openModal() {
      modal.style.display = "flex";
    }
    function closeModal() {
      modal.style.display = "none";
    }
    document.getElementById("modal-close-btn").addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.style.display === "flex") closeModal();
    });

    function showLoading() {
      modalBody.innerHTML = `<h2>Scoring your interview...</h2><p class="hint">This usually takes a few seconds.</p>`;
    }
    function showScorecard(text) {
      modalBody.innerHTML = `<h2>Your scorecard</h2>`;
      const pre = document.createElement("pre");
      pre.className = "scorecard";
      pre.textContent = text;
      modalBody.appendChild(pre);
    }
    function showUpsell(detail) {
      // detail is {score_summary, message} once the candidate has used up
      // their free interviews -- they still get scored, just not the full
      // rubric breakdown, so show the score first and the upgrade prompt
      // (with the Get Premium CTA) below it.
      modalBody.innerHTML = `<h2>Your scorecard</h2>`;
      if (detail && detail.score_summary) {
        const pre = document.createElement("pre");
        pre.className = "scorecard";
        pre.textContent = detail.score_summary;
        modalBody.appendChild(pre);
      }
      const p = document.createElement("p");
      p.textContent = (detail && detail.message) || detail;
      modalBody.appendChild(p);
      modalBody.insertAdjacentHTML(
        "beforeend",
        `<button type="button" class="btn" id="modal-get-premium-btn" style="display:inline-block; margin-top:12px;"><span class="btn-shine">Get Premium</span></button>
         <p class="hint" id="modal-premium-error" style="display:none;"></p>`
      );
      document.getElementById("modal-get-premium-btn").addEventListener("click", startCheckout);
    }

    // Same checkout flow as the "Get Premium" button on index.html --
    // creates a real Stripe Checkout session server-side and redirects
    // there, rather than just linking to the marketing pricing section.
    async function startCheckout() {
      const btn = document.getElementById("modal-get-premium-btn");
      const errorEl = document.getElementById("modal-premium-error");
      errorEl.style.display = "none";
      if (btn) btn.disabled = true;
      try {
        const res = await fetch(`${CONFIG.backendUrl}/billing/create-checkout-session`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeader() },
          body: JSON.stringify({
            success_url: window.location.origin + window.location.pathname.replace(/session\.html$/, "") + "premium-success.html",
            cancel_url: window.location.href,
          }),
        });
        if (res.status === 401) {
          showAuthError((await res.json().catch(() => ({}))).detail);
          return;
        }
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.detail || "Something went wrong starting checkout.";
          errorEl.style.display = "block";
          if (btn) btn.disabled = false;
          return;
        }
        window.location.href = data.url;
      } catch (err) {
        errorEl.textContent = "Something went wrong. Refresh the page and try again, or email diegomazorosete@gmail.com.";
        errorEl.style.display = "block";
        if (btn) btn.disabled = false;
      }
    }
    function showError(message) {
      modalBody.innerHTML = `<h2>Something went wrong</h2>`;
      const p = document.createElement("p");
      p.className = "hint";
      p.textContent = message;
      modalBody.appendChild(p);
    }
    function showGenericError() {
      // For failures with no useful detail to show (a network-level
      // fetch() rejection like "TypeError: Failed to fetch" carries no
      // information a candidate can act on) -- point them at a retry and a
      // way to reach us instead of surfacing the raw JS error message.
      modalBody.innerHTML = `<h2>Something went wrong</h2>`;
      const p = document.createElement("p");
      p.className = "hint";
      p.textContent = "Refresh the page and try again.";
      modalBody.appendChild(p);
      modalBody.insertAdjacentHTML(
        "beforeend",
        `<p class="hint"><a href="mailto:diegomazorosete@gmail.com?subject=Loudcase%20feedback">Send feedback to our team</a></p>`
      );
    }
    function showAuthError(detail) {
      // Deliberately NOT calling logout() here -- that clears the token and
      // redirects immediately with zero explanation, which is exactly what
      // made a real 401 look like the app randomly logging the candidate
      // out mid-interview. Show why, and let them choose to re-login instead
      // of doing it to them silently.
      modalBody.innerHTML = `<h2>Couldn't fetch your scorecard</h2>`;
      const p = document.createElement("p");
      p.className = "hint";
      p.textContent = detail || "Your session looks invalid.";
      modalBody.appendChild(p);
      modalBody.insertAdjacentHTML(
        "beforeend",
        `<button type="button" class="btn secondary" id="modal-relogin-btn" style="margin-top:12px;">Log in again</button>`
      );
      document.getElementById("modal-relogin-btn").addEventListener("click", logout);
    }

    async function runScoring() {
      showLoading();
      openModal();
      try {
        const res = await fetch(`${CONFIG.backendUrl}/evaluate`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeader() },
          body: JSON.stringify({ case_id: caseId, session_id: generatedSessionId }),
        });
        if (res.status === 401) {
          const data = await res.json().catch(() => ({}));
          showAuthError(data.detail);
          return;
        }
        const data = await res.json();
        if (res.status === 402) {
          showUpsell(data.detail);
          return;
        }
        if (res.status === 404) {
          // The backend only saves a transcript once the candidate's first
          // reply reaches our custom LLM (the interviewer's opening line is
          // spoken directly by ElevenLabs' own TTS and never touches our
          // server) -- so ending the call without ever answering means no
          // session file exists yet. That's an expected outcome, not a
          // broken request, so say so plainly instead of surfacing the
          // raw "No saved session at ..." backend detail.
          showError("You ended the interview before responding to the case, so there's nothing to score yet. Try again and share your approach before ending the call.");
          return;
        }
        if (res.ok) {
          showScorecard(data.scorecard);
        } else {
          showError(`Error: ${data.detail || res.status}`);
        }
      } catch (err) {
        showGenericError();
      }
    }

    // Manual fallback -- always works, regardless of the auto-trigger below.
    let autoTriggered = false;
    document.getElementById("evaluate-btn").addEventListener("click", () => {
      autoTriggered = true; // stop the poll loop from also firing afterwards
      runScoring();
    });

    // Auto-trigger: poll the backend for ElevenLabs' own post-call webhook
    // having marked this session ended (see agent/server.py's
    // /webhooks/elevenlabs + /session-status). Every previous attempt at
    // detecting "call ended" from inside the browser turned out to be
    // either wrong or actively harmful: there's no "conversationEnded" DOM
    // event on this widget (confirmed by reading the shipped bundle),
    // patching window.RTCPeerConnection/WebSocket to watch the transport
    // broke the widget's own real-time audio handling, and scraping its
    // rendered text for an "ended the conversation" message can't be
    // trusted either -- this Agent has custom widget text configured in
    // the ElevenLabs dashboard (its button reads "Start interview", not
    // the widget's default "Start a call"), so there's no guarantee the
    // disconnect string matches what we'd hardcode here.
    //
    // The webhook is authoritative and server-to-server, so this just asks
    // "is it done yet?" every few seconds instead of watching the widget at
    // all. If the webhook isn't configured yet (or delivery is delayed),
    // this simply never sees `ended: true` and the manual button above
    // keeps working exactly as it already does.
    async function pollSessionStatus() {
      if (autoTriggered) return;
      try {
        const res = await fetch(
          `${CONFIG.backendUrl}/session-status?case_id=${encodeURIComponent(caseId)}&session_id=${encodeURIComponent(generatedSessionId)}`
        );
        if (res.ok) {
          const data = await res.json();
          if (data.ended) {
            autoTriggered = true;
            runScoring();
            return;
          }
        }
      } catch (err) {
        // Network hiccup on a background poll -- just try again next tick.
      }
      setTimeout(pollSessionStatus, 3000);
    }
    pollSessionStatus();
  }
</script>

<button type="button" class="feedback-fab" id="feedback-fab">Feedback</button>
<div class="modal-overlay" id="product-feedback-modal" style="display:none;">
  <div class="modal-card">
    <button type="button" class="modal-close" id="product-feedback-close-btn" aria-label="Close">&times;</button>
    <h2>Send feedback</h2>
    <p>Found a bug, or have a suggestion? Let us know.</p>
    <form class="feedback-form" id="product-feedback-form">
      <textarea id="product-feedback-text" placeholder="What's on your mind?" required></textarea>
      <div style="display:flex; align-items:center; gap:12px; margin-top:12px;">
        <button type="submit" class="btn" id="product-feedback-submit"><span class="btn-shine">Send</span></button>
        <span class="hint" id="product-feedback-status"></span>
      </div>
    </form>
  </div>
</div>
<script>
(function () {
  const fab = document.getElementById("feedback-fab");
  const modal = document.getElementById("product-feedback-modal");
  const form = document.getElementById("product-feedback-form");
  const textarea = document.getElementById("product-feedback-text");
  const submitBtn = document.getElementById("product-feedback-submit");
  const status = document.getElementById("product-feedback-status");

  function openFeedbackModal() {
    status.textContent = "";
    textarea.value = "";
    modal.style.display = "flex";
    textarea.focus();
  }
  function closeFeedbackModal() {
    modal.style.display = "none";
  }

  fab.addEventListener("click", openFeedbackModal);
  document.getElementById("product-feedback-close-btn").addEventListener("click", closeFeedbackModal);
  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeFeedbackModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.style.display === "flex") closeFeedbackModal();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = textarea.value.trim();
    if (!message) return;
    submitBtn.disabled = true;
    status.textContent = "Sending...";
    try {
      const res = await fetch(`${CONFIG.backendUrl}/feedback`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeader() },
        body: JSON.stringify({ message, page: window.location.pathname.split("/").pop() }),
      });
      if (res.status === 401) {
        status.textContent = "Please log in again to send feedback.";
        submitBtn.disabled = false;
        return;
      }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        status.textContent = data.detail || "Something went wrong sending your feedback.";
        submitBtn.disabled = false;
        return;
      }
      status.textContent = "Thanks -- we got it!";
      submitBtn.disabled = false;
      setTimeout(closeFeedbackModal, 1200);
    } catch (err) {
      status.textContent = "Something went wrong. Please try again.";
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
